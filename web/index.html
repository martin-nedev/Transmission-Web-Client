<!doctype html>
<html lang="en" xml:lang="en">
  
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=8,IE=9,IE=10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./images/favicon.ico" />
    <link rel="shortcut icon" href="./images/favicon.png" />
    <link rel="apple-touch-icon" href="./images/tchicon.png" />
    <link rel="stylesheet" href="./transmission.css" />
    <script type="text/javascript" src="./transmission.js"></script>
    <title>Transmission Web Interface</title>
  </head>

  <body>

      <header class="toolbar" id="toolbar">
        <input
          class="add-torrent-input"
          id="add-torrent-input"
          type="file"
          name="torrent-files[]"
          multiple="true"
          tabindex="0" hidden/>
        <button
          class="button"
          id="add-torrent"
          data-action="add-torrent"
          tabindex="0">
          <svg
            class="svg"
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="11"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line></svg> 
        </button>
        <button
          class="button"
          id="remove-torrent"
          data-action="remove-torrent"
          tabindex="0">
          <svg
            class="svg"
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="11"></circle>
            <line x1="9" y1="9" x2="15" y2="15"></line>
            <line x1="9" y1="15" x2="15" y2="9"></line></svg> 
        </button>
        <div class="flexible-space"></div>
        <button
          class="button"
          id="start-torrents"
          data-action="start-torrents"
          tabindex="0">
          <svg
            class="svg"
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="11"></circle>
            <line x1="10" y1="8" x2="16" y2="12"></line>
            <line x1="16" y1="12" x2="10" y2="16"></line>
            <line x1="10" y1="16" x2="10" y2="8"></line></svg>
        </button>        
        <button
          class="button"
          id="stop-torrents"
          data-action="stop-torrents"
          tabindex="0">
          <svg
            class="svg"
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="11"></circle>
            <line x1="10" y1="9" x2="10" y2="15"></line>
            <line x1="14" y1="9" x2="14" y2="15"></line></svg> 
        </button>
        <div class="flexible-space"></div>
        <button
          class="button"
          id="sort-order"
          data-action="sort-order"
          tabindex="0">
          <svg
            class="svg"
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="11"></circle>
            <line x1="8" y1="11" x2="10" y2="8"></line>
            <line x1="10" y1="8" x2="10" y2="16"></line>
            <line x1="14" y1="8" x2="14" y2="16"></line>
            <line x1="14" y1="16" x2="16" y2="13"></line></svg> 
        </button>
        <button
          class="button"
          id="alt-speed"
          data-action="alt-speed">
          <svg
            class="svg-on"
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="11"></circle>
            <circle cx="12" cy="12" r="2"></circle>
            <line x1="12" y1="12" x2="7" y2="7"></line></svg> 
          <svg
            class="svg-off"
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="11"></circle>
            <circle cx="12" cy="12" r="2"></circle>
            <line x1="12" y1="12" x2="17" y2="7"></line></svg> 
          </button>
      </header>

      <header class="statusbar" id="statusbar">
        <div class="down" id="down">
          <svg
            class="svg"
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="6" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="15" x2="18" y2="9"></line></svg>
        </div>
        <div class="speed-down" id="speed-down"></div>
        <div class="flexible-space"></div>
        <div class="up" id="up">
          <svg
            class="svg"
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round">
          <line x1="6" y1="15" x2="12" y2="9"></line>
          <line x1="12" y1="9" x2="18" y2="15"></line></svg>
        </div>
        <div class="speed-up" id="speed-up"></div>
      </header>

      <main class= "main" id="main">
        <ul class="torrents" id="torrents"></ul>
      </main>

  </body>
</html>
